<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Stock List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-100 font-sans">
<div class="flex">
    <!-- Sidebar -->
    <div class="w-64 bg-gray-800 min-h-screen text-white">
        <h2 class="text-2xl font-bold p-4">Store Manager</h2>
        <ul>
            <li class="p-4 hover:bg-gray-700"><a href="/dashboard">Dashboard</a></li>
            <li class="p-4 bg-gray-700 font-semibold rounded-l-md"><a href="/stocks" class="block w-full">Stocks</a></li>
            <li class="p-4 hover:bg-gray-700"><a href="/orders">Orders</a></li>
            <li class="p-4 hover:bg-gray-700"><a href="/logout">Logout</a></li>
        </ul>
    </div>

    <!-- Main content -->
    <div class="flex-1 p-8">
        <div class="flex justify-between mb-4">
            <h1 class="text-3xl font-bold">Stocks</h1>
            <a href="/stocks/add" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">Add Stock</a>
        </div>

        <table class="min-w-full bg-white shadow rounded">
            <thead>
            <tr class="bg-green-500 text-white">
                <th class="py-2 px-4">ID</th>
                <th class="py-2 px-4">Stock ID</th>
                <th class="py-2 px-4">Name</th>
                <th class="py-2 px-4">Quantity</th>
                <th class="py-2 px-4">Purchase Date</th>
                <th class="py-2 px-4">Expiry Date</th>
                <th class="py-2 px-4">Total In Store</th>
                <th class="py-2 px-4">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="stock : ${stocks}" class="border-b hover:bg-gray-100">
                <td class="py-2 px-4" th:text="${stock.id}"></td>
                <td class="py-2 px-4" th:text="${stock.stockId}"></td>
                <td class="py-2 px-4" th:text="${stock.stockName}"></td>
                <td class="py-2 px-4" th:text="${stock.quantityPurchased}"></td>
                <td class="py-2 px-4" th:text="${stock.purchaseDate}"></td>
                <td class="py-2 px-4" th:text="${stock.expiryDate}"></td>
                <td class="py-2 px-4" th:text="${stock.totalInStore}"></td>
                <td class="py-2 px-4 space-x-2">
                    <a th:href="@{/stocks/edit/{id}(id=${stock.id})}"
                       class="bg-yellow-400 text-white px-2 py-1 rounded hover:bg-yellow-500">Edit</a>
                    <a th:href="@{/stocks/delete/{id}(id=${stock.id})}"
                       class="bg-red-500 text-white px-2 py-1 rounded hover:bg-red-600">Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- SweetAlert Popup -->
<!-- SweetAlert Popup -->
<script th:inline="javascript">
    /*<![CDATA[*/
    /* Only render if popupMessage exists */
    /* This way Thymeleaf won't even generate JS if it's null */
    /*]]>*/
</script>

<th:block th:if="${popupMessage != null}">
    <script th:inline="javascript">
        let popupMessage = [[${'"' + popupMessage + '"'}]];
        Swal.fire({
            icon: 'success',
            title: popupMessage,
            showConfirmButton: false,
            timer: 2000
        });
    </script>
</th:block>

</body>
</html>
