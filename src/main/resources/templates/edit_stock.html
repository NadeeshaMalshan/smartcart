<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Stock</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
<div class="flex">
    <!-- Sidebar -->
    <div class="w-64 bg-gray-800 min-h-screen text-white">
        <h2 class="text-2xl font-bold p-4">Store Manager</h2>
        <ul>
            <li class="p-4 hover:bg-gray-700"><a href="/dashboard">Dashboard</a></li>
            <li class="p-4 hover:bg-gray-700"><a href="/stocks">Stocks</a></li>
            <li class="p-4 hover:bg-gray-700"><a href="/orders">Orders</a></li>
            <li class="p-4 hover:bg-gray-700"><a href="/logout">Logout</a></li>
        </ul>
    </div>

    <!-- Main content -->
    <div class="flex-1 p-8">
        <h1 class="text-3xl font-bold mb-6">Edit Stock</h1>

        <form th:action="@{/stocks/update/{id}(id=${stock.id})}"
              th:object="${stock}" method="post"
              class="bg-white shadow rounded p-6 space-y-4">

            <div>
                <label class="block mb-1 font-bold">Stock ID</label>
                <input type="text" th:field="*{stockId}" readonly
                       class="w-full border px-3 py-2 rounded bg-gray-200">
            </div>

            <div>
                <label class="block mb-1 font-bold">Stock Name</label>
                <input type="text" th:field="*{stockName}" class="w-full border px-3 py-2 rounded">
            </div>

            <div>
                <label class="block mb-1 font-bold">Quantity Purchased</label>
                <input type="number" th:field="*{quantityPurchased}" class="w-full border px-3 py-2 rounded">
            </div>

            <div>
                <label class="block mb-1 font-bold">Purchase Date</label>
                <input type="date" th:field="*{purchaseDate}" class="w-full border px-3 py-2 rounded">
            </div>

            <div>
                <label class="block mb-1 font-bold">Expiry Date</label>
                <input type="date" th:field="*{expiryDate}" class="w-full border px-3 py-2 rounded">
            </div>

            <div>
                <label class="block mb-1 font-bold">Total In Store</label>
                <input type="number" th:field="*{totalInStore}" class="w-full border px-3 py-2 rounded">
            </div>

            <button type="submit"
                    class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                Update
            </button>
        </form>
    </div>
</div>
</body>
</html>
